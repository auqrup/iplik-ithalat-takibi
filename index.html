<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İplik Takip Masası</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;margin:0;padding:0}
body{background:#f1f5f9;padding:15px;color:#1e293b}
.header{background:#fff;padding:15px;border-radius:10px;margin-bottom:10px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;border:1px solid #cbd5e1}
.toolbar{background:#fff;padding:10px;border-radius:10px;margin-bottom:15px;display:flex;flex-wrap:wrap;gap:8px;border:1px solid #cbd5e1}
.toolbar input,.toolbar select{padding:8px;border:1px solid #cbd5e1;border-radius:6px;font-size:13px}
.toolbar input{flex:1;min-width:180px}
.btn{padding:8px 14px;font-weight:bold;border-radius:6px;border:none;cursor:pointer;font-size:13px}
.btn:active{opacity:.8}
.btn:disabled{opacity:.5;cursor:wait}
.btn-green{background:#059669;color:#fff}.btn-dark{background:#0f172a;color:#fff}.btn-indigo{background:#4f46e5;color:#fff}
.btn-gray{background:#e2e8f0;color:#334155}.btn-photo{background:#0891b2;color:#fff}.btn-print{background:#7c3aed;color:#fff}
.btn-danger{background:#e11d48;color:#fff;padding:4px 8px;font-size:11px}
.sm{padding:5px 10px;font-size:11px;border-radius:5px}
.btn-order{background:#f59e0b;color:#451a03;border:1px solid #d97706}
.btn-arch{background:#0284c7;color:#fff}.btn-rest{background:#d97706;color:#fff}
.board{display:flex;gap:16px;overflow-x:auto;padding-bottom:15px;align-items:flex-start}
.column{background:#e2e8f0;width:335px;min-width:335px;border-radius:12px;padding:12px;border:1px solid #cbd5e1;display:flex;flex-direction:column;gap:12px}
.col-head{display:flex;justify-content:space-between;align-items:center;font-weight:bold}
.pill{font-size:11px;background:#fff;padding:2px 8px;border-radius:12px;border:1px solid #cbd5e1;font-weight:600}
.col-sum{font-size:11px;font-weight:700;color:#065f46;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:6px;padding:4px 8px;display:flex;justify-content:space-between}
.pf-block{background:#f8fafc;border:2px solid #475569;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.pf-head{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;border-bottom:1.5px solid #cbd5e1;padding-bottom:6px}
.pf-tag{background:#0f172a;color:#fff;padding:2px 6px;border-radius:4px;font-family:monospace;font-size:11px;font-weight:bold}
.pf-meta{font-size:11px;color:#475569;display:flex;justify-content:space-between;font-weight:600}
.card{background:#fff;border-radius:8px;border:1px solid #cbd5e1;overflow:hidden;font-size:12px}
.card-head{padding:8px;font-weight:bold;display:flex;justify-content:space-between;align-items:center;font-size:11px}
.card-head b{flex:1;text-align:center;text-transform:uppercase;padding:0 4px}
.card-body{padding:8px;display:flex;flex-direction:column;gap:4px}
.card-foot{flex-wrap:wrap;padding:6px 8px;background:#f8fafc;border-top:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;gap:5px}
.sumbox{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:6px;padding:6px 8px;display:flex;justify-content:space-between;font-weight:bold;font-size:11px;color:#065f46}
.cno{background:#0f172a;color:#fbbf24;padding:2px 4px;border-radius:4px;font-family:monospace}
